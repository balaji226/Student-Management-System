<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Student Management System</title>
    
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-header">
            <div class="login-logo">
                <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M22 10v6M2 10l10-5 10 5-10 5z"></path>
                    <path d="M6 12v5c3 3 9 3 12 0v-5"></path>
                </svg>
            </div>
            <h2>Student Management System</h2>
            <p>Sign in to access student records & dashboard</p>
        </div>

        <div class="demo-credentials-box">
            <div class="demo-text">
                <div><strong>Default Demo Credentials:</strong></div>
                <div>Username: <code>admin</code> | Password: <code>admin123</code></div>
            </div>
            <button type="button" class="btn btn-sm btn-secondary" onclick="fillDemoCredentials()">Auto Fill</button>
        </div>

        {% if messages %}
        <div style="margin-bottom: 1.25rem;">
            {% for message in messages %}
            <div style="padding: 0.75rem 1rem; border-radius: var(--radius-md); font-size: 0.85rem; margin-bottom: 0.5rem; {% if message.tags == 'error' %}background: var(--danger-bg); color: var(--danger-text); border: 1px solid var(--danger-border);{% else %}background: var(--primary-light); color: var(--primary);{% endif %}">
                {{ message }}
            </div>
            {% endfor %}
        </div>
        {% endif %}

        <form method="POST" action="{% url 'login' %}">
            {% csrf_token %}
            <div class="form-group" style="margin-bottom: 1.25rem;">
                <label for="username" class="form-label">Username</label>
                <input type="text" name="username" id="username" class="form-control" required placeholder="Enter admin username" autofocus>
            </div>

            <div class="form-group" style="margin-bottom: 1.5rem;">
                <label for="password" class="form-label">Password</label>
                <input type="password" name="password" id="password" class="form-control" required placeholder="Enter password">
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; padding: 0.75rem;">
                Sign In to Dashboard
            </button>
        </form>
    </div>

    <script src="{% static 'js/script.js' %}"></script>
</body>
</html>
